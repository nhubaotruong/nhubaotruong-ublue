# NMI_WATCHDOG=0 - already set via nowatchdog karg and sysctl

# Default to balanced profile, auto-switch on power source change
# 1 = auto switch (AC→performance, BAT→balanced)
TLP_AUTO_SWITCH=2
TLP_DEFAULT_MODE=BAL

RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto

WIFI_PWR_ON_BAT=on
SOUND_POWER_SAVE_ON_BAT=10

SATA_LINKPWR_ON_AC=med_power_with_dipm
SATA_LINKPWR_ON_BAT=min_power

DISK_APM_LEVEL_ON_AC="254"
DISK_APM_LEVEL_ON_BAT="128"

USB_AUTOSUSPEND=1

# TLP owns the writeback params: it rewrites dirty_writeback_centisecs / dirty_expire_centisecs
# from MAX_LOST_WORK_SECS_ON_{AC,BAT} (intrinsic defaults 15 s / 60 s) at every start and
# power-source change, so a value in /usr/lib/sysctl.d is silently replaced. Set it here: 60 s on
# battery (fewer disk wakeups), TLP's 15 s on AC (smaller data-loss window when plugged in).
MAX_LOST_WORK_SECS_ON_BAT=60

# PCIe ASPM by policy instead of the pcie_aspm=force karg (kernel docs: "WARNING: Forcing ASPM on
# may cause system lockups"). Start at powersave; after a clean week try powersupersave.
PCIE_ASPM_ON_BAT=powersave
