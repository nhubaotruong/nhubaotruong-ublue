vm.max_map_count=2147483642

vm.swappiness=180
vm.watermark_boost_factor=0
vm.watermark_scale_factor=125
vm.dirty_bytes=268435456
vm.dirty_background_bytes=134217728
vm.page-cluster=0

kernel.split_lock_mitigate=0

net.core.default_qdisc=fq
net.ipv4.tcp_congestion_control=bbr
net.ipv4.tcp_mtu_probing=1

fs.inotify.max_user_instances=8192
fs.inotify.max_user_watches=524288

fs.file-max=500000
net.ipv4.ip_forward=1
net.ipv6.conf.all.forwarding=1
kernel.nmi_watchdog=0
# vm.dirty_writeback_centisecs - owned by TLP, not by sysctl.d: /usr/share/tlp/func.d/15-tlp-func-disk
#   rewrites it (and dirty_expire_centisecs) from MAX_LOST_WORK_SECS_ON_{AC,BAT} at every start and
#   power-source change. Verified: a value here gets replaced by 1500 (AC) / 6000 (BAT).
#   Set the intent in /etc/tlp.d/tlp.conf instead.
# vm.laptop_mode - removed from the kernel: systemd-sysctl logs
#   "vm.laptop_mode is deprecated. Ignoring setting." on 7.2.4-ogc3.1 (TLP's DISK_IDLE_SECS_* too).

vm.compaction_proactiveness=0
vm.zone_reclaim_mode=0
vm.page_lock_unfairness=1
net.core.rmem_max=7500000
net.core.wmem_max=7500000

dev.i915.perf_stream_paranoid=0

# Consolidate timer interrupts to fewer CPUs (allows deeper idle on others)
kernel.timer_migration=1

# sched_wakeup_granularity_ns / sched_min_granularity_ns / sched_latency_ns no longer exist:
#   CFS was replaced by EEVDF, which exposes base_slice_ns via debugfs only. Boot log confirms
#   "Couldn't write '15000000' to 'kernel/sched_wakeup_granularity_ns' ... No such file or directory".
